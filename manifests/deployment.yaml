apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubespark
  namespace: default
  labels:
    app: kubespark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubespark
  template:
    metadata:
      labels:
        app: kubespark
    spec:
      # 🔑 关键配置：指定使用 kubespark ServiceAccount
      serviceAccountName: kubespark
      # 确保自动挂载 ServiceAccount token（默认是 true，但显式声明更清晰）
      automountServiceAccountToken: true
      containers:
      - name: kubespark
        image: kubespark:latest  # 替换为你的实际镜像
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /kapis/auth.kubespark.io/v1/login
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /kapis/auth.kubespark.io/v1/login
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5

