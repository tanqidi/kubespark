name: Sync from Gitea to GitHub

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "tanqidi"
          git config user.email "1729746565@qq.com"

      - name: Sync from Gitea (force overwrite dev)
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GITEA_URL: ${{ secrets.GITEA_URL }}
        run: |
          set -e

          echo "== 清理旧 remote =="
          git remote remove gitea || true

          echo "== 添加 Gitea remote =="
          git remote add gitea "https://${GITEA_TOKEN}@${GITEA_URL#https://}"

          echo "== 拉取 Gitea 的 dev 分支（不落地本地分支）=="
          git fetch gitea dev

          echo "== 强制覆盖 GitHub dev 分支 =="
          git push origin FETCH_HEAD:dev --force

          echo "== 同步 tags（可选）=="
          git fetch gitea --tags
          git push origin --tags --force
