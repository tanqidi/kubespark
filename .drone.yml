kind: pipeline
type: kubernetes
name: docker-aliyun

trigger:
  branch:
    - dev
  event:
    - push
    - custom

steps:
  # 1) 构建验证（Go 后端）
  - name: verify
    image: golang:1.21
    commands:
      - go mod download
      - go test ./...
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /tmp/kubespark-server ./cmd/server

  # 2) 构建 + 推送阿里云镜像
  - name: docker
    image: plugins/docker
    settings:
      registry: registry.cn-hangzhou.aliyuncs.com
      repo: registry.cn-hangzhou.aliyuncs.com/tanqidi-temp/kubespark
      tags:
        - dev
      dockerfile: Dockerfile
      context: .
      platforms:
        - linux/amd64
        - linux/arm64
      username:
        from_secret: aliyun_username
      password:
        from_secret: aliyun_password
    depends_on:
      - verify
